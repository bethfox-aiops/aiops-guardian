# my global config
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

rule_files: ["rules/aiops-alerts.yml"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "guardrail_lab"
    static_configs:
      - targets: ["localhost:8015"]

  - job_name: 'aiops-watchdog-k8s'
    static_configs:
      - targets: ['127.0.0.1:31097']

  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "all_check_agent"
    static_configs:
      - targets: ["localhost:8000"]

  - job_name: "disk_anomaly_ml"
    static_configs:
      - targets: ["localhost:8000"]

  - job_name: "disk_anomaly"
    static_configs:
      - targets: ["localhost:8000"]

  - job_name: "aiops-watchdog-knn"
    static_configs:
      - targets: ["localhost:8011"]

  - job_name: "aiops-watchdog-knn-online-pilot"
    static_configs:
      - targets: ["localhost:8019"]

  - job_name: "aiops-watchdog-iforest"
    static_configs:
      - targets: ["localhost:8012"]

  - job_name: "aiops-watchdog-autoencoder"
    static_configs:
      - targets: ["localhost:8013"]

  - job_name: "aiops-guardian-health"
    static_configs:
      - targets: ["localhost:8014"]

  - job_name: "aiops-watchdog-windows"
    static_configs:
      - targets: ["localhost:8016"]

  - job_name: "aiops-watchdog-logs"
    static_configs:
      - targets: ["localhost:8017"]

  - job_name: "aiops-watchdog-priority"
    static_configs:
      - targets: ["localhost:8018"]

  - job_name: 'windows-node'
    static_configs:
      - targets: ['DESKTOP-0AJUKU3:9182', 'DESKTOP-503POVP:9182']
