auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  # Default log_level (info) logs every routine internal housekeeping
  # cycle - index/table handover, periodic metrics, owned-streams
  # recalculation - at high frequency. Found 2026-08-05: loki alone
  # accounted for ~13,800 of ~16,000 total system log lines in a 40-minute
  # window, growing as more daily-sharded index tables accumulate over
  # this instance's lifetime (running since 2026-03-01). warn still
  # surfaces real problems (e.g. the ring-unhealthy errors seen during
  # suspend/resume) without the routine noise.
  log_level: warn

# Single-node Loki configuration — no clustering
common:
  path_prefix: /var/lib/loki
  replication_factor: 1
  # Pin the self-address to loopback rather than letting Loki auto-detect
  # the LAN interface IP at startup: single-node has no reason to reach
  # itself over the network, and auto-detection caches whatever IP was
  # current at process start -- when DHCP later hands this machine a new
  # address, every internal ring/ingester/scheduler call starts failing
  # with "no route to host" until the next restart. This class of bug was
  # live intermittently since 2026-02-13 (602k+ error log lines, 328k+
  # dropped log entries) before being caught and fixed on 2026-07-24.
  instance_addr: 127.0.0.1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /var/lib/loki/index
    cache_location: /var/lib/loki/cache
  filesystem:
    directory: /var/lib/loki/chunks

limits_config:
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 24
  max_cache_freshness_per_query: 10m
  allow_structured_metadata: false

ruler:
  storage:
    type: local
    local:
      directory: /var/lib/loki/rules
